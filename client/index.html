<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff7ee" />
    <title>שורשים — ארכיון המשפחה</title>
    <meta
      name="description"
      content="אילן יוחסין חי: תחנות, ציר זמן ואוצרות משפחתיים במקום אחד."
    />
    <!-- A family archive should not announce itself to search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!--
      The opening mark. It is the first thing drawn and the only thing on
      screen while the archive loads, so the browser is told to fetch it
      alongside the bundle rather than after it. Only the trunk is preloaded:
      the seven nodes are not needed until a second into the animation, by
      which time they have arrived on their own.
    -->
    <link rel="preload" as="image" href="/logo/tree.webp" type="image/webp" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 32px; font-family: system-ui, sans-serif; text-align: center">
        כדי לצפות בארכיון המשפחתי יש להפעיל JavaScript בדפדפן.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
